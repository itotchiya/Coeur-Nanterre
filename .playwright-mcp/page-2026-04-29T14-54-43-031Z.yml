      - generic [ref=e45]:
        - paragraph [ref=e46]: Coeur Nanterre, c'est 9 logements - une maison ancienne rehabilitee et un batiment neuf, construits cote a cote avec les memes materiaux, le meme soin.
        - paragraph [ref=e47]: On a volontairement garde le projet petit. Neuf logements, pas plus. Assez pour que chacun se sente vraiment chez soi, pas dans une residence anonyme. L'idee etait simple, ne pas effacer ce qui existait, mais le faire coexister avec du neuf, ancien et contemporain, sans rupture.
